name: Claude reviewer spend

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish:
    if: vars.AIWA_CLAUDE_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read aggregate spend from LiteLLM
        env:
          AIWA_REVIEW_REPORT_SSH_KEY: ${{ secrets.AIWA_REVIEW_REPORT_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/aiwa-review-report-key"
          report_file="$RUNNER_TEMP/aiwa-review-spend.json"
          trap 'shred -u "$key_file" 2>/dev/null || true' EXIT

          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$AIWA_REVIEW_REPORT_SSH_KEY" > "$key_file"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/aiwa-review-known-hosts" \
            -i "$key_file" \
            root@104.168.54.196 > "$report_file"

          python -m json.tool "$report_file" >/dev/null

      - name: Update spend dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/claude_review_spend_dashboard.py
          --input "$RUNNER_TEMP/aiwa-review-spend.json"
          --issue "${{ vars.AIWA_CLAUDE_SPEND_ISSUE }}"
