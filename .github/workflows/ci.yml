name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.action != 'labeled' || github.event.label.name == 'deep-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -r stats/requirements.txt
      - run: python -m py_compile aiwa_bot.py llm.py analytics_v2.py cycle.py image.py report.py stats/server.py scripts/migrate_legacy_analytics.py scripts/claude_pr_review.py
      - run: python -m unittest discover -s tests -v
      - run: pip install pip-audit bandit
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r stats/requirements.txt
      - run: bandit -q -r aiwa_bot.py llm.py analytics_v2.py cycle.py image.py report.py stats/server.py scripts/migrate_legacy_analytics.py scripts/claude_pr_review.py -ll

  claude-review:
    name: Claude review
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      vars.AIWA_CLAUDE_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      AIWA_REVIEW_BASE_URL: http://127.0.0.1:14000
      AIWA_REVIEW_MODEL: ${{ contains(github.event.pull_request.labels.*.name, 'deep-review') && 'aiwa-review-opus-5' || 'aiwa-review-sonnet-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Open encrypted tunnel to AIWA LiteLLM
        env:
          AIWA_REVIEW_SSH_KEY: ${{ secrets.AIWA_REVIEW_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/aiwa-review-tunnel-key"
          control_socket="$RUNNER_TEMP/aiwa-review-ssh-control"

          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$AIWA_REVIEW_SSH_KEY" > "$key_file"

          ssh -fNT -M -S "$control_socket" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ExitOnForwardFailure=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/aiwa-review-known-hosts" \
            -i "$key_file" \
            -L 127.0.0.1:14000:127.0.0.1:4000 \
            aiwa-tunnel@104.168.54.196

          shred -u "$key_file"

          for attempt in {1..10}; do
            if curl --fail --silent --show-error \
              --max-time 3 \
              http://127.0.0.1:14000/health/liveliness >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "LiteLLM did not become healthy through the SSH tunnel" >&2
          exit 1

      - name: Review pull request with Claude
        env:
          AIWA_REVIEW_LITELLM_KEY: ${{ secrets.AIWA_REVIEW_LITELLM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/claude_pr_review.py

      - name: Close tunnel and remove credentials
        if: always()
        run: |
          control_socket="$RUNNER_TEMP/aiwa-review-ssh-control"
          key_file="$RUNNER_TEMP/aiwa-review-tunnel-key"
          ssh -S "$control_socket" -O exit aiwa-tunnel@104.168.54.196 2>/dev/null || true
          if [[ -f "$key_file" ]]; then
            shred -u "$key_file"
          fi
