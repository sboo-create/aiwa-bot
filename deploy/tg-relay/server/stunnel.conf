; AIWA egress relay — server side (relay host).
; Fixed-destination TLS wrapper: принимает только mTLS-клиентов AIWA и
; подключается ровно к перечисленным upstream. Никакого CONNECT/SOCKS и
; выбора произвольного destination. Внутренний TLS (приложение -> upstream)
; проходит насквозь и здесь не расшифровывается.

foreground = yes
sslVersionMin = TLSv1.2
debug = notice

[telegram]
accept = 0.0.0.0:15443
connect = api.telegram.org:443
; delay = yes: DNS upstream разрешается на каждое новое соединение,
; IP Telegram не фиксируется в конфигурации.
delay = yes
cert = /etc/tg-relay/certs/server-cert.pem
key = /etc/tg-relay/certs/server-key.pem
CAfile = /etc/tg-relay/certs/ca.pem
verifyChain = yes
requireCert = yes

[openrouter]
accept = 0.0.0.0:16443
connect = openrouter.ai:443
delay = yes
cert = /etc/tg-relay/certs/server-cert.pem
key = /etc/tg-relay/certs/server-key.pem
CAfile = /etc/tg-relay/certs/ca.pem
verifyChain = yes
requireCert = yes
