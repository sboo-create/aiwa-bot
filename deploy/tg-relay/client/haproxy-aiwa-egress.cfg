# AIWA egress failover на application host. Применяется на cutover:
# frontend-порты совпадают с теми, куда приложение уже ходит (8443/14443),
# поэтому смена SSH-туннелей на relay не требует изменения конфигурации
# приложения. Health check каждого backend выполняет ВНУТРЕННИЙ TLS handshake
# с SNI upstream через весь путь (client mTLS -> relay -> upstream), то есть
# проверяет реальную достижимость Telegram/OpenRouter, а не только локальный
# порт stunnel-клиента.
#
# Пока relay один (A на i196), backend B закомментирован; при добавлении
# relay B достаточно раскомментировать строки и перечитать конфиг.

global
    maxconn 512
    user haproxy
    group haproxy

defaults
    mode tcp
    timeout connect 5s
    # долгий long poll getUpdates (~50s) и скачивание файлов
    timeout client 300s
    timeout server 300s

frontend telegram_in
    bind 127.0.0.1:8443
    default_backend telegram_out

backend telegram_out
    option log-health-checks
    default-server inter 30s fall 2 rise 2
    server relay_a 127.0.0.1:18443 check check-ssl check-sni api.telegram.org verify required verifyhost api.telegram.org ca-file /etc/ssl/certs/ca-certificates.crt
    # server relay_b 127.0.0.1:28443 backup check check-ssl check-sni api.telegram.org verify required verifyhost api.telegram.org ca-file /etc/ssl/certs/ca-certificates.crt

frontend openrouter_in
    bind 127.0.0.1:14443
    default_backend openrouter_out

backend openrouter_out
    option log-health-checks
    default-server inter 30s fall 2 rise 2
    server relay_a 127.0.0.1:24443 check check-ssl check-sni openrouter.ai verify required verifyhost openrouter.ai ca-file /etc/ssl/certs/ca-certificates.crt
    # server relay_b 127.0.0.1:34443 backup check check-ssl check-sni openrouter.ai verify required verifyhost openrouter.ai ca-file /etc/ssl/certs/ca-certificates.crt

frontend groq_in
    bind 127.0.0.1:9443
    default_backend groq_out

backend groq_out
    option log-health-checks
    default-server inter 30s fall 2 rise 2
    server relay_a 127.0.0.1:26443 check check-ssl check-sni api.groq.com verify required verifyhost api.groq.com ca-file /etc/ssl/certs/ca-certificates.crt
    # server relay_b 127.0.0.1:36443 backup check check-ssl check-sni api.groq.com verify required verifyhost api.groq.com ca-file /etc/ssl/certs/ca-certificates.crt
