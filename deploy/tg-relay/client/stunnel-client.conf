; AIWA egress relay — client side (application host, например i167).
; Каждый section слушает loopback-порт и оборачивает трафик во внешний mTLS
; до relay. Приложение продолжает делать обычный HTTPS к api.telegram.org /
; openrouter.ai (внутренний TLS проверяется приложением end-to-end);
; loopback-порт подставляется через service-specific hosts file.
;
; Порты client A (relay на i196):
;   127.0.0.1:18443 -> relay:15443 -> api.telegram.org:443
;   127.0.0.1:24443 -> relay:16443 -> openrouter.ai:443
; Для будущего relay B зарезервированы 28443/34443.

foreground = yes
sslVersionMin = TLSv1.2
debug = notice

[telegram-a]
client = yes
accept = 127.0.0.1:18443
connect = 104.168.54.196:15443
cert = /etc/aiwa-relay/certs/client-cert.pem
key = /etc/aiwa-relay/certs/client-key.pem
CAfile = /etc/aiwa-relay/certs/ca.pem
verifyChain = yes
checkHost = relay-a.aiwa.egress

[openrouter-a]
client = yes
accept = 127.0.0.1:24443
connect = 104.168.54.196:16443
cert = /etc/aiwa-relay/certs/client-cert.pem
key = /etc/aiwa-relay/certs/client-key.pem
CAfile = /etc/aiwa-relay/certs/ca.pem
verifyChain = yes
checkHost = relay-a.aiwa.egress

[groq-a]
client = yes
accept = 127.0.0.1:26443
connect = 104.168.54.196:17443
cert = /etc/aiwa-relay/certs/client-cert.pem
key = /etc/aiwa-relay/certs/client-key.pem
CAfile = /etc/aiwa-relay/certs/ca.pem
verifyChain = yes
checkHost = relay-a.aiwa.egress
