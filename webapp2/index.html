function fmtD(iso){var p=iso.split('-');return parseInt(p[2],10)+' '+MONTHS[parseInt(p[1],10)-1];}
function cycleChart(hist){
  var items=hist.filter(function(h){return h.len!=null;}).slice(-7);
  var pts=items.map(function(h){return h.len;});
  if(pts.length<2) return '';
  var W=340,H=176,padL=34,padR=14,padT=24,padB=34;
  var lo=Math.min.apply(null,pts),hi=Math.max.apply(null,pts);
  lo=Math.min(lo,21)-2; hi=Math.max(hi,35)+2; if(hi-lo<6){hi=lo+6;}
  function X(i){return padL+(W-padL-padR)*(pts.length<2?0:i/(pts.length-1));}
  function Y(v){return H-padB-(H-padT-padB)*(v-lo)/(hi-lo);}
  var bandTop=Y(35),bandBot=Y(21);
  var path='';pts.forEach(function(v,i){path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});
  var dots='';pts.forEach(function(v,i){var nrm=(v>=21&&v<=35),x=X(i),y=Y(v),st=items[i].start.split('-');dots+="<circle cx='"+x.toFixed(1)+"' cy='"+y.toFixed(1)+"' r='5' fill='"+(nrm?'var(--ui-accent-green)':'var(--ui-accent-orange)')+"'/><text x='"+x.toFixed(1)+"' y='"+(y-9).toFixed(1)+"' text-anchor='middle' font-size='10' fill='var(--ui-text-secondary)' font-weight='700'>"+v+"</text><text x='"+x.toFixed(1)+"' y='"+(H-10)+"' text-anchor='middle' font-size='9' fill='var(--ui-text-tertiary)'>"+parseInt(st[2],10)+"."+st[1]+"</text>";});
  return "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:auto;display:block'>"+
    "<rect x='"+padL+"' y='"+bandTop.toFixed(1)+"' width='"+(W-padL-padR)+"' height='"+Math.max(0,bandBot-bandTop).toFixed(1)+"' rx='6' fill='var(--ui-fill-tertiary)'/>"+
    "<text x='4' y='"+Y(35).toFixed(1)+"' font-size='9' fill='var(--ui-text-tertiary)'>35</text><text x='4' y='"+Y(28).toFixed(1)+"' font-size='9' fill='var(--ui-text-tertiary)'>28</text><text x='4' y='"+Y(21).toFixed(1)+"' font-size='9' fill='var(--ui-text-tertiary)'>21</text>"+
    "<path d='"+path+"' fill='none' stroke='var(--ui-separator)' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/>"+dots+"</svg>";
}
function paperHomeCycleChartData(hist){
  var items=hist.filter(function(h){return h.len!=null;}).slice(-3);
  if(items.length<2)return [];
  var months=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return items.map(function(item){
    var parts=item.start.split('-'),month=months[Math.max(0,parseInt(parts[1],10)-1)]||'';
    return{label:month,value:Number(item.len)};
  });
}

async function toggleMic(){
  if(recording){try{mediaRec&&mediaRec.stop();}catch(e){}return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Голос недоступен в этом клиенте, напиши текстом');return;}
  var stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Нет доступа к микрофону');return;}
  var mime=(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))?'audio/webm':((window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/mp4'))?'audio/mp4':'');
  try{mediaRec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){try{mediaRec=new MediaRecorder(stream);}catch(e2){toast('Запись не поддерживается');return;}}
  recChunks=[];
  mediaRec.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data);};
  mediaRec.onstop=function(){recording=false;setMic(false);try{stream.getTracks().forEach(function(t){t.stop();});}catch(e){}var type=(mediaRec&&mediaRec.mimeType)||mime||'audio/webm';var blob=new Blob(recChunks,{type:type});if(blob.size<900){toast('Слишком коротко, зажми и говори');return;}sendVoice(blob,type);};
  try{mediaRec.start();recording=true;setMic(true);haptic('impact','medium');toast('Говорю… нажми ■, чтобы отправить');}catch(e){toast('Не удалось начать запись');setMic(false);}
}
async function sendVoice(blob,type){
  if(!chatInited){go('chat');}

  try{
    var ext=(type&&type.indexOf('mp4')>=0)?'mp4':'webm';
    var fd=new FormData();fd.append('initData',INIT);fd.append('audio',blob,'voice.'+ext);
    var r=await fetch('/api/voice',{method:'POST',body:fd});var d=await r.json();
    me.textContent=(d&&d.transcript)?d.transcript:'🎤 (не расслышала)';
    t.textContent=(d&&d.answer)||'Не получилось ответить, попробуй ещё раз.';
    if(d&&d.suggestions&&d.suggestions.length){var c=document.createElement('div');c.className='chips';d.suggestions.forEach(function(s){var b=document.createElement('button');b.className='chip';b.textContent=(s&&s.length>34)?s.slice(0,32).trim()+'…':s;b.onclick=function(){send(s);};c.appendChild(b);});t.appendChild(c);}
  }catch(e){t.textContent='Не получилось распознать голос, попробуй ещё раз.';}
  scrollBottom();
}

  h+="<div class='cellrow' onclick=\"hubToggle('data')\"><div class='ci'>📏</div><div class='ctxt'><div class='ct'>Мои данные</div><div class='cc'>рост "+(p.height||"—")+" · вес "+(p.weight||"—")+" · возраст "+(p.age||"—")+"</div></div><div class='chev'>›</div></div>";
  h+="<div id='hub-data' class='hubpanel hidden'><div class='hubgrid3'><input id='hubH' inputmode='decimal' placeholder='Рост' value='"+esc(p.height||"")+"'><input id='hubW' inputmode='decimal' placeholder='Вес' value='"+esc(p.weight||"")+"'><input id='hubA' inputmode='numeric' placeholder='Возраст' value='"+esc(p.age||"")+"'></div><div class='trlabel' style='margin:12px 2px 6px'>Средняя длина цикла</div><input id='hubCycle' class='tpin' inputmode='numeric' placeholder='напр. 28' value='"+esc(D&&D.cycle_len||"")+"'><button class='pbtn' style='margin-top:10px' onclick='saveHubProfile()'>Сохранить</button></div>";
  h+="<div class='cellrow' onclick=\"hubToggle('time')\"><div class='ci'>⏰</div><div class='ctxt'><div class='ct'>Время утренней сводки</div><div class='cc'>"+(D.send_time||"08:00")+" · МСК</div></div><div class='chev'>›</div></div>";
  h+="<div id='hub-time' class='hubpanel hidden'><input id='hubTime' placeholder='09:00' value='"+esc(D.send_time||"08:00")+"'><button class='pbtn' style='margin-top:8px' onclick='saveHubTime()'>Сохранить</button></div>";
  h+="<div class='cellrow' onclick='hubPartner()'><div class='ci'>❤️</div><div class='ctxt'><div class='ct'>Партнёр и близкие</div><div class='cc'>"+(D.partner_linked?"подключён":"короткая сводка партнёру")+"</div></div><div class='chev'>›</div></div>";
  h+="<div id='hub-partner' class='hubpanel hidden'></div>";
  h+="</div>";
  document.getElementById('hub').innerHTML=h;
}
async function chooseMode(m){var r=await api('/api/mode',{mode:m});if(r&&r.ok){toast("Режим: "+modeLabel(m));closeHub();await reloadAfterEdit();}else{toast((r&&r.text)||"Не получилось сменить режим");}}
function switchPreg(){chooseMode('preg');}
async function saveHubPrefs(){var t=(document.getElementById('hubPrefs').value||"").trim();var _kc=(document.getElementById('hubKcal')&&document.getElementById('hubKcal').value||"").trim();var r=await api('/api/prefs',{diet_note:t,kcal_goal:_kc});if(r&&r.ok){D.profile=D.profile||{};D.profile.diet_note=r.diet_note;if('kcal_goal' in r)D.profile.kcal_goal=r.kcal_goal;if(r.kcal_base)D.kcal_base=r.kcal_base;loadedFood=false;toast(_kc&&r.kcal_goal?("Цель: "+r.kcal_goal+" ккал"):"Сохранила предпочтения");renderHub();}else toast("Не получилось сохранить");}
async function saveHubProfile(){var h=parseFloat(String(document.getElementById('hubH').value||"").replace(",","."));var w=parseFloat(String(document.getElementById('hubW').value||"").replace(",","."));var a=parseInt(String(document.getElementById('hubA').value||""),10);if(!(h>120&&h<220&&w>30&&w<250&&a>10&&a<80)){toast("Проверь рост, вес и возраст");return;}var _cy=parseInt(String(document.getElementById('hubCycle')&&document.getElementById('hubCycle').value||''),10);var _body={height:h,weight:w,age:a};if(_cy>=15&&_cy<=60)_body.cycle_len=_cy;var r=await api('/api/profile',_body);if(r&&r.ok){D.profile=Object.assign(D.profile||{},r.profile);if(r.kcal_base)D.kcal_base=r.kcal_base;if(r.cycle_len)D.cycle_len=r.cycle_len;loadedFood=false;loadedTrain=false;toast("Данные обновлены");renderHub();}else toast((r&&r.text)||"Не получилось сохранить");}
function setKcalPreset(m){var b=(D&&D.kcal_base)||0;if(!b){toast('Заполни рост, вес и возраст');return;}var el=document.getElementById('hubKcal');if(el)el.value=Math.round(b*m/10)*10;}
async function saveHubTime(){var t=(document.getElementById('hubTime').value||"").trim();var r=await api('/api/settime',{time:t});if(r&&r.ok){D.send_time=r.send_time;toast("Сводка в "+r.send_time);renderHub();}else toast((r&&r.text)||"Время в формате 09:00");}
function getReport(){
  var h="<div class='hubhead'><div class='hubtitle'>Выписка для врача</div><button class='hubclose' aria-label='Закрыть' onclick='closeHub()'>✕</button></div><div class='hubpanel'>";
  h+="<div class='cc' style='margin-bottom:12px'>За какой период собрать выписку? PDF придёт в чат бота.</div>";
  h+="<div style='display:flex;flex-direction:column;gap:8px'>";
  h+="<button class='pbtn' onclick=\"doReport('3')\">Последние 3 месяца</button>";
  h+="<button class='pbtn' onclick=\"doReport('6')\">Последние 6 месяцев</button>";
  h+="<button class='pbtn alt' onclick=\"doReport('all')\">Весь период</button>";
  h+="</div></div>";
  document.getElementById('hub').innerHTML=h;
  document.getElementById('hubBackdrop').classList.remove('hidden');document.getElementById('hub').classList.remove('hidden');
}
async function doReport(period){closeHub();toast('Готовлю выписку…');var r=await api('/api/report',{period:period});if(r&&r.ok)toast('Выписка отправлена в чат бота');else toast((r&&r.text)||'Выписка временно недоступна');}
async function hubPartner(){var box=document.getElementById('hub-partner');['mode','prefs','data','time'].forEach(function(x){var e=document.getElementById('hub-'+x);if(e)e.classList.add('hidden');});box.classList.remove('hidden');box.innerHTML="<div style='font-size:13px;color:var(--inkMid)'>Готовлю ссылку…</div>";var r=await api('/api/partner',{});if(r&&r.linked){box.innerHTML="<div class='partnerstatus'>Партнёр подключён.</div><button class='copylink danger' onclick='unlinkPartnerHub()'>Отключить партнёра</button>";return;}if(!(r&&r.link)){box.innerHTML="<div style='font-size:13px;color:var(--inkMid)'>Ссылка будет доступна после запуска из Telegram. В боте — команда /partner.</div>";return;}box.innerHTML="<div class='partnernote'>Перешли ссылку партнёру — он подтвердит подключение в боте.</div><div class='partnerbox'><div class='ln' id='hubPlink'>"+esc(r.link)+"</div><button class='copylink' onclick='copyHubLink()'>Скопировать ссылку</button></div>";}
async function unlinkPartnerHub(){var r=await api('/api/partner',{action:'unlink'});if(r&&r.ok){D.partner_linked=false;toast("Партнёр отключён");hubPartner();}}
function copyHubLink(){var t=document.getElementById('hubPlink');if(!t)return;var s=t.textContent||"";if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast("Ссылка скопирована");}).catch(function(){toast("Ссылка готова");});}else toast("Ссылка готова");}

const MLVL={1:"плохое",2:"нормальное",3:"хорошее"};
const THINKS=["Айва думает","подбирает рекомендации","сверяет с твоей фазой","проверяет твои данные","собирает ответ"];
function bloaderHTML(cls){var p="";for(var i=0;i<5;i++){p+="<span class='bp' style='--r:"+(i*72)+"deg;transform:rotate("+(i*72)+"deg);animation-delay:"+(i*0.12)+"s'></span>";}return "<span class='bload "+(cls||"")+"'>"+p+"<span class='bc'></span></span>";}
function thinkHTML(label){return "<span class='thinkrow'>"+bloaderHTML('sm')+"<span class='think'>"+(label||"Айва думает")+"<span></span><span></span><span></span></span></span>";}
function startThink(){var i=0;return setInterval(function(){i=(i+1)%THINKS.length;var ns=document.querySelectorAll('.think .tt');for(var k=0;k<ns.length;k++){(function(e){e.style.opacity='0';setTimeout(function(){e.textContent=THINKS[i];e.style.opacity='1';},230);})(ns[k]);}},2700);}
function placeAvatar(){var g=document.querySelector('#scr-today .greet');if(!g)return;if(g.parentNode&&g.parentNode.classList&&g.parentNode.classList.contains('greetrow'))return;var wrap=document.createElement('div');wrap.className='greetrow';g.parentNode.insertBefore(wrap,g);wrap.appendChild(g);var av=document.createElement('div');av.className='avatar';av.id='avatar';av.textContent=(NAME&&NAME.trim())?NAME.trim().charAt(0):'•';av.onclick=openHub;wrap.appendChild(av);}
function periodHistory(){var pp=(D&&D.past_periods)||[];if(!pp.length)return "";var arr=[];for(var i=pp.length-1;i>=0;i--){var p=pp[i];var len=(i<pp.length-1)?Math.round((new Date(pp[i+1].start+"T00:00:00")-new Date(pp[i].start+"T00:00:00"))/86400000):null;arr.push("<div class='mealcard'><div class='mealico'>🩸</div><div style='min-width:0'><div class='ds'>с "+fmtD(p.start)+(p.end?(" по "+fmtD(p.end)):"")+"</div><div class='mealwhy'>"+((len&&len>=15&&len<=90)?("цикл "+len+" дней"):"отмеченные месячные")+"</div></div></div>");}return "<div class='card'><div class='sec' style='margin-top:0'>История месячных</div>"+expandList(arr,3,"Показать ещё циклы")+"</div>";}
function expandList(arr,shown,label){if(arr.length<=shown)return arr.join("");var id="ex"+Math.floor(Math.random()*1e6),n=arr.length-shown,more=label+" ("+n+")";return arr.slice(0,shown).join("")+"<div id='"+id+"' class='hidden'>"+arr.slice(shown).join("")+"</div><button class='chip' style='margin:8px 2px 0' onclick=\"var e=document.getElementById('"+id+"');e.classList.toggle('hidden');this.textContent=e.classList.contains('hidden')?'"+more+"':'Свернуть';\">"+more+"</button>";}
function symptomDiary(){var logs=(D&&D.sym_log)||[];logs=logs.filter(function(l){return (l.symptoms&&l.symptoms.length)||l.energy||l.mood;});if(!logs.length)return "<div class='emptygraph'>Пока нет отметок. Отмечай самочувствие и симптомы на экране «Сегодня» — здесь появится дневник.</div>";logs=logs.slice().reverse();var arr=logs.map(function(l){var syms=(l.symptoms||[]).map(symLabel).filter(Boolean);var meta=[];if(l.energy)meta.push("энергия "+(LVL[l.energy]||""));if(l.mood)meta.push("настроение "+(MLVL[l.mood]||""));var chips=syms.map(function(s){return "<span class='nutrichip'>"+esc(s)+"</span>";}).join("");return "<div class='mealcard'><div class='mealico'>📝</div><div style='min-width:0'><div class='ds'>"+fmtD(l.date)+"</div>"+(meta.length?"<div class='mealwhy'>"+meta.join(" · ")+"</div>":"")+(chips?"<div class='foodchips' style='margin-top:6px'>"+chips+"</div>":"")+"</div></div>";});return expandList(arr,3,"Показать ещё");}
function applyViewport(){if(!tg)return;try{var sa=(tg.safeAreaInset&&tg.safeAreaInset.top)||0;var ca=(tg.contentSafeAreaInset&&tg.contentSafeAreaInset.top)||0;var t=sa+ca;if(tg.isFullscreen&&t<44)t=56;document.documentElement.style.setProperty('--safe-top',t+'px');}catch(e){}}
if(tg){try{tg.onEvent&&tg.onEvent('viewportChanged',applyViewport);tg.onEvent&&tg.onEvent('safeAreaChanged',applyViewport);tg.onEvent&&tg.onEvent('contentSafeAreaChanged',applyViewport);tg.onEvent&&tg.onEvent('fullscreenChanged',applyViewport);}catch(e){}applyViewport();setTimeout(applyViewport,800);}

document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.pbtn,.chip,.swapbtn,.copylink');if(!b)return;haptic('impact','light');var r=document.createElement('span');r.className='ripple';var rc=b.getBoundingClientRect();r.style.left=(e.clientX-rc.left)+'px';r.style.top=(e.clientY-rc.top)+'px';b.appendChild(r);setTimeout(function(){if(r.parentNode)r.parentNode.removeChild(r);},600);});
function boot(){applyCanonicalToday();installDayRollover();renderToday();try{if(window.AiwaDeslop&&window.AiwaDeslop.prefetch)window.AiwaDeslop.prefetch();}catch(e){}var _tab=null;try{_tab=new URLSearchParams(location.search).get('tab');}catch(e){}var _ok={today:1,food:1,train:1,chat:1};go(_ok[_tab]?_tab:'today');}
function demoAiwaData(){
  var p1=isoOf(addDays(today,-99)),p2=isoOf(addDays(today,-71)),p3=isoOf(addDays(today,-40)),p4=isoOf(addDays(today,-11));
  return{
    onboarded:true,name:NAME,mode:"cycle",cycle:true,cycle_len:29,last_period:p4,day:12,phase:"follicular",days_to_next:18,status:"normal",

      {start:p1,end:isoOf(addDays(today,-95)),len:28,period_len:5},

      {start:p1,end:isoOf(addDays(today,-95))},
      {start:p2,end:isoOf(addDays(today,-67))},
      {start:p3,end:isoOf(addDays(today,-36))},
      {start:p4,end:isoOf(addDays(today,-7))}
    ],

    sym_log:[
      {date:isoOf(addDays(today,-4)),energy:2,mood:2,symptoms:["bloat"]},
      {date:isoOf(addDays(today,-3)),energy:2,mood:3,symptoms:[]},
      {date:isoOf(addDays(today,-2)),energy:3,mood:3,symptoms:["head"]},
      {date:isoOf(addDays(today,-1)),energy:3,mood:2,symptoms:[]},
      {date:isoOf(today),energy:3,mood:3,symptoms:["tired"]}
    ],

  };
}
function startAiwa(){
  if(WEB_DEMO){D=demoAiwaData();boot();}
  else if(INIT){api('/api/data',{name:NAME}).then(function(d){if(d&&d.onboarded){D=d;boot();}else{showNeedOnboard();}});}
  else{D={onboarded:true,cycle:true,last_period:null,cycle_len:28,name:NAME};boot();}
}
if(window.AiwaDeslop)startAiwa();
else window.addEventListener('aiwa:deslop-ready',startAiwa,{once:true});
